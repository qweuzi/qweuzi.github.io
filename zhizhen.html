<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>指针仪表</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        html,body{margin:0;padding:0;height:100%}
        #gauge-box{width:100%;height:100%;min-height:320px;}
    </style>
</head>
<body>
<div id="gauge-box"></div>

<script>
    var myChart = echarts.init(document.getElementById('gauge-box'));
    var option = {
        series: [
            {
                type: 'gauge',
                startAngle: 200,
                endAngle: -20,
                min: 0,
                max: 100, // 最大值自行修改
                splitNumber: 10,
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
                        {offset: 0, color: '#2ecc71'}, //绿色安全
                        {offset: 0.6, color: '#f1c40f'}, //黄色预警
                        {offset: 0.9, color: '#e74c3c'} //红色危险
                    ])
                },
                progress: {show: true, width: 12},
                pointer: {width: 5}, //指针粗细
                axisLine: {lineStyle: {width: 12}},
                axisTick: {distance: -18, length: 8},
                splitLine: {distance: -25, length: 18},
                axisLabel: {distance: -12, fontSize: 12},
                title: {fontSize: 16},
                detail: {
                    valueAnimation: true,
                    fontSize: 24,
                    offsetCenter: [0, '70%']
                },
                data: [
                    {value: 68, name: '站点完成率'} // value为数值，name标题
                ]
            }
        ]
    };
    myChart.setOption(option);
    // 窗口自适应（简道云嵌入缩放自动适配）
    window.addEventListener('resize',()=>myChart.resize())
</script>
</body>
</html>
